<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F1F3FA" />
    <title>ZNIXX: daily snake puzzle</title>
    <meta name="description" content="Twist a snake of 24 wedges into the shape of the day. A new puzzle every day, plus levels and free building." />
    <link rel="icon" href="icon.png" type="image/png" />
    <style>
      /* The game's look (index.html, src/ui/theme.ts, src/ui/home.ts): its light studio sweep, ink text and the logo's wedge colours. */
      :root { --ink: #1f2547; --muted: #5e678c; --primary: #1a66d9; --primary-rgb: 26, 102, 217;
        --brand: linear-gradient(120deg, #1a66d9, #2837be 55%, #7b23d6); }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: radial-gradient(120% 90% at 50% 18%, #f1f3fa 0%, #e3e7f4 45%, #c9d1ea 100%) fixed;
        color: var(--ink); font: 18px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      main { padding: 32px 16px; max-width: 560px; }
      img { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 16px 40px rgba(31, 37, 71, 0.18), 0 2px 6px rgba(31, 37, 71, 0.08); }
      /* The wordmark: capitals in the logo's colours, sky to violet, as on the home screen. */
      h1 { font-size: 56px; line-height: 1; margin: 22px auto 10px; width: fit-content; font-weight: 750; letter-spacing: 0.02em;
        text-transform: uppercase; background: linear-gradient(90deg, #13a9d6, #1a66d9, #2837be, #7b23d6);
        -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { margin: 0 0 22px; color: var(--muted); }
      .tag { color: var(--ink); font-weight: 700; }
      .soon { display: inline-block; padding: 10px 20px; border-radius: 999px; background: var(--brand); color: #fff; font-weight: 700;
        box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12), 0 10px 26px rgba(var(--primary-rgb), 0.32); }
      a { color: var(--primary); }
      .small { font-size: 15px; margin-top: 36px; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="ZNIXX icon" />
      <h1>Znixx</h1>
      <p class="tag">Twist the snake into shape</p>
      <p>A new shape to build every day, hundreds of levels, a 70-stage story, and a free-build mode for making your own.</p>
      <p><span class="soon">Coming soon to Google Play</span></p>
      <p class="small"><a href="privacy/">Privacy policy</a></p>
    </main>
  </body>
</html>
