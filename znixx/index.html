<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZNIXX: daily snake puzzle</title>
    <meta name="description" content="Twist a snake of 24 wedges into the shape of the day. A new puzzle every day, plus levels and free building." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <style>
      :root { --ink: #1f2547; --muted: #5e678c; --cobalt: #2d5bff; --lemon: #ffd23f; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #2d5bff, #1e3fd0);
        color: #fff; font: 18px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      main { padding: 32px 16px; max-width: 560px; }
      img { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25); }
      h1 { font-size: 56px; margin: 18px 0 4px; letter-spacing: -0.03em; }
      p { margin: 0 0 22px; color: #dce4ff; }
      .tag { color: var(--lemon); font-weight: 700; }
      a { color: #fff; }
      .small { font-size: 15px; margin-top: 36px; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.svg" alt="ZNIXX icon" />
      <h1>Znixx</h1>
      <p class="tag">Twist the snake into shape</p>
      <p>A new shape to build every day, dozens of levels, and a free-build mode for making your own.</p>
      <p>Coming soon to Google Play.</p>
      <p class="small"><a href="privacy/">Privacy policy</a></p>
    </main>
  </body>
</html>
